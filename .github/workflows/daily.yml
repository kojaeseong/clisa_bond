name: daily-update
on:
  schedule:
    - cron: "40 0,5 * * 1-5"   # 평일 09:40·14:40 KST (전날 거래분이 늦게 올라와도 받도록 두 번)
    - cron: "40 0 * * 6"       # 토요일 09:40 KST (금요일 거래분)
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-update      # 두 실행이 겹치지 않게
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/daily.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - run: python scripts/visits.py
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
      - run: |
          git config user.name "clisa-bot"
          git config user.email "clisageo@clisa.ai"
          git add docs data/missing_issuers.txt; git add data/visits.csv data/referers.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "자료 갱신 $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs origin main   # 실행 중 다른 push가 있었으면 그 위에 얹음
          git push
